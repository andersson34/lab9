name: capstone-ci-cd

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: andersson34/lab9

jobs:
  build:
    name: Build images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - ocr
          - search
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: docker build -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:${{ github.sha }}" "./services/${{ matrix.service }}"

  test:
    name: Unit Contract E2E
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start test environment
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build

      - name: Wait for services health
        run: sh prototype/ci-cd/scripts/wait-for-health.sh

      - name: OCR unit tests
        run: docker compose exec -T ocr-service npm run test:unit

      - name: Search unit tests
        run: docker compose exec -T search-service npm run test:unit

      - name: Contract tests
        run: docker compose exec -T search-service npm run test:contract

      - name: E2E tests
        run: docker compose run --rm test-runner npm run test:e2e

      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v

  push:
    name: Push images
    runs-on: ubuntu-latest
    needs:
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - ocr
          - search
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${{ env.REGISTRY }}" -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: |
          IMAGE_SHA="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:${{ github.sha }}"
          IMAGE_LATEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}-${{ matrix.service }}:latest"
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" "./services/${{ matrix.service }}"
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"
